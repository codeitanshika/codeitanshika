<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170">
  <defs>
    <g id="sprite">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#000000" stroke-width="1" />
      <ellipse cx="-5" cy="-2" rx="4" ry="5" fill="#ffffff" />
      <ellipse cx="5" cy="-2" rx="4" ry="5" fill="#ffffff" />
      <circle cx="-5" cy="-1" r="2" fill="#000000" />
      <circle cx="5" cy="-1" r="2" fill="#000000" />
      <line x1="-6" y1="12" x2="-10" y2="18" stroke="#161616" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="12" x2="10" y2="18" stroke="#161616" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="13" x2="0" y2="19" stroke="#161616" stroke-width="2" stroke-linecap="round" />
    </g>
  </defs>

  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="40" fill="#e8e8e8" opacity="0">
    Hi, I'm Anshika
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="1s" begin="0s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0 18; 0 18; 0 0" keyTimes="0;0.45;1" dur="1s" begin="0s" fill="freeze" />
  </text>

  <use href="#sprite" x="130" y="130">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" keyTimes="0;0.5;1" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
  </use>
  <use href="#sprite" x="255" y="138">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" keyTimes="0;0.5;1" dur="1.3s" begin="0.45s" repeatCount="indefinite" />
  </use>
  <use href="#sprite" x="385" y="138">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" keyTimes="0;0.5;1" dur="1.3s" begin="0.8s" repeatCount="indefinite" />
  </use>
  <use href="#sprite" x="510" y="130">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" keyTimes="0;0.5;1" dur="1.3s" begin="1.15s" repeatCount="indefinite" />
  </use>

  <g fill="#cfcfcf">
    <circle cx="130" cy="115" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
      <animate attributeName="cy" values="128;108;108" keyTimes="0;0.5;1" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="255" cy="123" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="1.3s" begin="0.45s" repeatCount="indefinite" />
      <animate attributeName="cy" values="136;116;116" keyTimes="0;0.5;1" dur="1.3s" begin="0.45s" repeatCount="indefinite" />
    </circle>
    <circle cx="385" cy="123" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="1.3s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="136;116;116" keyTimes="0;0.5;1" dur="1.3s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="510" cy="115" r="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="1.3s" begin="1.15s" repeatCount="indefinite" />
      <animate attributeName="cy" values="128;108;108" keyTimes="0;0.5;1" dur="1.3s" begin="1.15s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
